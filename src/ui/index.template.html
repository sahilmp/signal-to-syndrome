<div id="s2s-app">
  <header class="site-header">
    <h1>Signal to Syndrome</h1>
    <section class="hero" data-s2s="hero" hidden></section>
    <nav aria-label="Level selector">
      <div class="level-select" role="group" aria-label="Choose a level" data-s2s="levels"></div>
    </nav>
  </header>
  <main data-s2s="main"></main>
  <footer class="site-footer">
    <p>Signal to Syndrome, version <span data-s2s="version">{{VERSION}}</span>. Open source under the MIT licence.</p>
    <p>This effort is supported by Qollab & IonQ.</p>
    <details class="diagnostics">
      <summary>Diagnostics</summary>
      <div data-s2s="diagnostics"><p>Diagnostics appear when the page script has run.</p></div>
    </details>
  </footer>
</div>
